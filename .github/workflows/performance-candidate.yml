name: Performance candidate verification
on:
  pull_request:
    branches: [ui/followup-20261125]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: perf-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'perf/v0.323-static-render'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify:release-baseline
      - run: npm run typecheck
      - run: npm run build:offline
      - run: npm test
      - run: npm run test:render
      - run: node scripts/performance-touch-geometry.mjs
      - run: node apps/client/test/build-solo-app.mjs
      - run: npm run test:package-pwa
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'perf/v0.323-static-render'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:solo-app
      - run: npx playwright install --with-deps chromium
      - run: node --test apps/client/test/battle-immersive-browser.test.mjs
      - run: node --test apps/client/test/solo-app-browser.test.mjs apps/client/test/update-browser.test.mjs


  combat_profile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'perf/v0.323-static-render'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '15802d04696b51239e3ca30db912de2606ad0e47'
          path: perf-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build:solo-app
      - run: npm ci && npm run build:solo-app
        working-directory: perf-baseline
      - run: npx playwright install --with-deps chromium
      - name: Paired active combat timing, alternating order
        shell: bash
        run: |
          for order in 'baseline candidate' 'candidate baseline' 'baseline candidate'; do
            for kind in $order; do
              dist="$PWD/dist/solo-app"
              if [ "$kind" = baseline ]; then dist="$PWD/perf-baseline/dist/solo-app"; fi
              echo "ACTIVE COMBAT $kind"
              CARD_DUEL_PROFILE_COMBAT=1 CARD_DUEL_SOLO_APP_DIST_DIR="$dist" node --test --test-name-pattern 'real worker queues two attacks' apps/client/test/battle-immersive-browser.test.mjs
            done
          done
      - name: Count drag writes without timing instrumentation
        run: CARD_DUEL_PROFILE_DRAG_WRITES=1 node --test --test-name-pattern 'real worker queues two attacks' apps/client/test/battle-immersive-browser.test.mjs

  ai_profile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'perf/v0.323-static-render'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 'ca83498357bccdd2b9752117466fd2a4f7d64970'
          path: perf-ai
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm ci && npm run typecheck && node --test packages/engine/test/bot.test.ts
        working-directory: perf-ai
      - name: Compare AI decisions with fixed node budgets
        shell: bash
        run: |
          for order in 'baseline candidate' 'candidate baseline' 'baseline candidate'; do
            for kind in $order; do
              root="$PWD"
              if [ "$kind" = candidate ]; then root="$PWD/perf-ai"; fi
              echo "FIXED NODES AI $kind"
              (cd "$root" && CARD_DUEL_FIXED_NODES=1 node apps/cli/benchmark-device-ai.ts 3 25 auto mid) | tee -a "/tmp/ai-$kind.jsonl"
            done
          done
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const read=p=>readFileSync(p,"utf8").trim().split("\n").map(JSON.parse);
            const a=read("/tmp/ai-baseline.jsonl"),b=read("/tmp/ai-candidate.jsonl");
            assert.equal(a.length,b.length);assert.ok(a.length>1);
            for(let i=0;i<a.length;i++){
              if(a[i].weights){assert.equal(a[i].weights,b[i].weights);continue;}
              for(const key of ["mode","difficulty","positions","nodeBudget","rankedActionSha256","acceptedActionSha256"])assert.equal(a[i][key],b[i][key],key);
              assert.ok(a[i].positions>0 && a[i].rankedActionSha256);
              console.log(JSON.stringify({mode:a[i].mode,difficulty:a[i].difficulty,beforeMedianMs:a[i].medianMs,afterMedianMs:b[i].medianMs,beforeP95Ms:a[i].p95Ms,afterP95Ms:b[i].p95Ms,decisionMatch:true}));
            }
          '

  pwa_profile:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'perf/v0.323-static-render'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: '4e2613a32c31bc39d67d0509f46f0e0cbb7b6b71'
          path: perf-bundle
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build:solo-app
      - run: node --test perf-bundle/test/performance-pwa-bundle-prototype.test.mjs
      - run: node perf-bundle/scripts/performance-pwa-bundle-study.mjs dist/solo-app/game.css
      - name: Generate and verify isolated eight-bundle prototype
        run: |
          node perf-bundle/scripts/performance-pwa-bundle-prototype.mjs dist/solo-app perf-bundle/dist/solo-app 8
          node perf-bundle/apps/cli/serve-solo-app.mjs --verify perf-bundle/dist/solo-app
      - run: npx playwright install --with-deps chromium
      - name: Compare installation, offline startup, frames and image hashes
        shell: bash
        run: |
          CARD_DUEL_CPU_THROTTLE=4 node perf-bundle/scripts/performance-browser.mjs . | tee /tmp/pwa-baseline.json
          CARD_DUEL_CPU_THROTTLE=4 node perf-bundle/scripts/performance-browser.mjs perf-bundle | tee /tmp/pwa-bundled.json
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            import assert from "node:assert/strict";
            const a=JSON.parse(readFileSync("/tmp/pwa-baseline.json","utf8")),b=JSON.parse(readFileSync("/tmp/pwa-bundled.json","utf8"));
            const art=new Map(a.flatMap(s=>s.art).map(x=>[x.name,x.hash]));
            let matched=0;
            for(const x of b.flatMap(s=>s.art))if(art.has(x.name)){assert.equal(x.hash,art.get(x.name));matched++;}
            assert.ok(matched>0,"No overlapping rendered art identities");
            for(const mobile of [true,false]){
              const med=(xs,f)=>xs.map(f).sort((x,y)=>x-y)[Math.floor(xs.length/2)];
              const report=xs=>{const s=xs.filter(x=>x.mobile===mobile);return {firstCacheMs:med(s,x=>x.installReadyMs),offlineMenuMs:med(s,x=>x.offline.menuMs),p99:med(s,x=>x.frames.p99)}};
              console.log(JSON.stringify({mobile,before:report(a),after:report(b),matchedArt:matched}));
            }
          '
