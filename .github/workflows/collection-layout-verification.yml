name: Verify shared collection layout
on:
  pull_request:
    branches: [release/v0.325.0]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: collection-layout-verification
  cancel-in-progress: true
jobs:
  browser:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ui/collection-layout-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build:solo-app
      - run: npx playwright install --with-deps chromium
      - run: node --test apps/client/test/collection-tap-browser.test.mjs
      - run: node --test apps/client/test/battle-immersive-browser.test.mjs apps/client/test/landscape-solo-browser.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-screen-evidence
          path: ui-evidence/
          if-no-files-found: ignore
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ui/collection-layout-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run verify:release-baseline && npm run typecheck && npm run build:solo-app
      - run: npm run test:playable-core && npm test && npm run test:render
      - run: node scripts/performance-source-audit.mjs --strict
